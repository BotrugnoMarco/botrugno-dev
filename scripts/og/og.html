<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#080808;color:#f1f1f1;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden;
       background-image:radial-gradient(circle,rgba(255,255,255,.05) 1.4px,transparent 1.4px);background-size:28px 28px}
  .wrap{position:absolute;inset:0;padding:84px 88px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{height:96px;width:auto;align-self:flex-start}
  h1{font-weight:800;font-size:84px;line-height:1;letter-spacing:-2.5px;margin:0}
  h1 span{background:linear-gradient(135deg,#cc1414 0%,#1240cc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{margin-top:22px;font-size:34px;color:#b5b5b5;font-weight:500}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:26px;color:#888}
  .foot b{color:#f1f1f1;font-weight:600}
  .line{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#cc1414,#1240cc)}
</style></head>
<body><div class="wrap">
  <img class="logo" src="b.svg" alt="">
  <div><h1>Marco Luigi <span>Botrugno</span></h1><div class="role">Full-Stack Developer · Vue, React, Node.js, Ionic</div></div>
  <div class="foot"><b>botrugno.dev</b><span>Portfolio e progetti</span></div>
</div><div class="line"></div></body></html>
