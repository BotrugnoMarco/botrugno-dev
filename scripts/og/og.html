<!doctype html>
<!-- Anteprima per i link condivisi. Si genera con: npm run og  (2400×1260, il doppio di 1200×630).
     Pochi elementi e testi grandi: LinkedIn e le app la ricomprimono in JPEG e la mostrano piccola. -->
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#080808;color:#f1f1f1;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden}
  .wrap{position:absolute;inset:0;padding:96px 96px 104px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{height:120px;width:auto;align-self:flex-start}
  h1{font-weight:800;font-size:100px;line-height:1;letter-spacing:-3px;margin:0}
  h1 span{background:linear-gradient(135deg,#cc1414 0%,#1240cc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{margin-top:26px;font-size:44px;color:#c9c9c9;font-weight:600;letter-spacing:-.5px}
  .line{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#cc1414,#1240cc)}
</style></head>
<body><div class="wrap">
  <img class="logo" src="b.svg" alt="">
  <div><h1>Marco Luigi <span>Botrugno</span></h1><div class="role">Full-Stack Developer</div></div>
</div><div class="line"></div></body></html>
