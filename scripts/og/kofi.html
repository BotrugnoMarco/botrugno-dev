<!doctype html>
<!-- Copertina per Ko-fi, 3:1. Si genera con: npm run kofi  (2400×800, il doppio di 1200×400).
     Stessa grafica di og.html. Contenuto al centro: Ko-fi su mobile può tagliare i lati. -->
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px;height:400px;background:#080808;color:#f1f1f1;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:44px;padding-bottom:8px}
  .logo{height:132px;width:auto}
  h1{font-weight:800;font-size:76px;line-height:1;letter-spacing:-2.5px;margin:0;white-space:nowrap}
  h1 span{background:linear-gradient(135deg,#cc1414 0%,#1240cc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{margin-top:18px;font-size:34px;color:#c9c9c9;font-weight:600;letter-spacing:-.5px}
  .line{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#cc1414,#1240cc)}
</style></head>
<body><div class="wrap">
  <img class="logo" src="b.svg" alt="">
  <div><h1>Marco Luigi <span>Botrugno</span></h1><div class="role">Full-Stack Developer</div></div>
</div><div class="line"></div></body></html>
