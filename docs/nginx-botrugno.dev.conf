# Snippet da includere nel blocco `server { ... }` HTTPS di botrugno.dev
# (es. /etc/nginx/snippets/botrugno-headers.conf  →  include snippets/botrugno-headers.conf;)
# Dopo le modifiche:  sudo nginx -t && sudo systemctl reload nginx

# --- Header di sicurezza ---------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;

# CSP: consente Google Fonts e Google Analytics (gtag) usati nel layout, e gli script
# che Cloudflare può iniettare (offuscamento email in /cdn-cgi/, Web Analytics).
# Se aggiungi altri servizi esterni, aggiungili qui o il browser li bloccherà.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# --- Cache -----------------------------------------------------------------
# I file in /_astro/ hanno l'hash nel nome: si possono tenere in cache per un anno.
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # nginx non eredita gli add_header del server quando un location ne definisce di propri:
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Il CV cambia raramente ma deve aggiornarsi subito quando lo rigeneri.
location ~ ^/CV_Marco_Luigi_Botrugno(_EN)?\.pdf$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Attenzione: se nel blocco server c'è già un `location / { ... }` con propri add_header,
# gli header di sicurezza qui sopra non valgono per le pagine: vanno ripetuti anche lì.

# --- Pagina 404 di Astro ------------------------------------------------------
error_page 404 /404.html;
