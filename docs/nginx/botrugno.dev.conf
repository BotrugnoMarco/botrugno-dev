# botrugno.dev — configurazione nginx completa
# Sul server: /etc/nginx/sites-available/botrugno.dev.conf (link in sites-enabled)
# Richiede: /etc/nginx/snippets/botrugno-security-headers.conf (da docs/nginx/security-headers.conf)
# Dopo le modifiche:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name botrugno.dev;

    # deploy.sh compila il sito in /botrugno.dev/dist
    root /botrugno.dev/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/botrugno.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/botrugno.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include snippets/botrugno-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # I file in /_astro/ hanno l'hash nel nome: si possono tenere in cache per un anno.
    location /_astro/ {
        include snippets/botrugno-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Il CV cambia raramente ma deve aggiornarsi subito quando lo rigeneri.
    location ~ ^/CV_Marco_Luigi_Botrugno(_EN)?\.pdf$ {
        include snippets/botrugno-security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Pagina 404 di Astro
    error_page 404 /404.html;
}

# www → dominio principale (il canonical del sito è https://botrugno.dev)
server {
    listen 443 ssl;
    server_name www.botrugno.dev;

    ssl_certificate /etc/letsencrypt/live/botrugno.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botrugno.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://botrugno.dev$request_uri;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name botrugno.dev www.botrugno.dev;
    return 301 https://botrugno.dev$request_uri;
}
