# Header di sicurezza di botrugno.dev
# Sul server: /etc/nginx/snippets/botrugno-security-headers.conf
#
# nginx non eredita gli add_header del blocco server in un location che ne definisce di propri:
# per questo il file si include sia nel server sia nei location con add_header (vedi botrugno.dev.conf).

# HSTS senza includeSubDomains: i sottodomini (matchready, matchday) hanno configurazioni proprie.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;

# CSP: il sito carica solo risorse proprie (font compresi). Gli script che Cloudflare può
# iniettare, come l'offuscamento delle email, arrivano da /cdn-cgi/ sullo stesso dominio.
# Se aggiungi servizi esterni, aggiungili qui o il browser li bloccherà.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
