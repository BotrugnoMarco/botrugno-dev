name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # ogni lunedì: ricontrolla anche i link esterni
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Il CV è presente nella build
        run: test -f dist/CV_Marco_Luigi_Botrugno.pdf && test -f dist/CV_Marco_Luigi_Botrugno_EN.pdf

      - name: Link interni (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true

      - name: Link esterni (solo controllo settimanale)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --max-retries 2 --accept 200,429 'dist/**/*.html'
          fail: true
